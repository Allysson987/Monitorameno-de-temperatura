<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaGil</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        header img {
            height: 130px;
            margin: 10px;
        }
        h1 {
            margin: 0;
        }
        #map {
            flex: 1;
            margin-bottom: 100px; /* Garante que o mapa não sobreponha o rodapé */
        }
        footer {
            background-color: white;
            padding: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000; /* Garante que o rodapé fique acima do mapa */
        }
        footer img {
            height: 100px; 
            margin: 0 15px;
        }
    </style>
</head>
<body>

<header>
    <img src="gil.png" alt="Logo ETE">
    <h1>ClimaGil</h1>
</header>

<div id="map"></div>

<footer>
    <img src="inovagil.png" alt="Logo Inovagil">
    <img src="qrcode.png" alt="QR Code">
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    // Inicializa o mapa sem centralizar inicialmente
    const map = L.map('map').setView([0, 0], 2); // Configuração inicial básica

    // Adicionando um layer de mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © OpenStreetMap contributors'
    }).addTo(map);

    // Ícone de marcador verde (padrão)
    const iconGreen = L.icon({
        iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-icon.png', // Ícone verde padrão
        iconSize: [25, 41], 
        iconAnchor: [12, 41], 
        popupAnchor: [1, -34]
    });

    // Ícone de marcador vermelho (alerta)
    const iconRed = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png', // Ícone vermelho para alertas
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    });

    // Função para obter as unidades da API
    async function fetchUnidades() {
        try {
            const response = await fetch('http://localhost:3000/unidades');
            const unidades = await response.json();
            if (unidades.length > 0) {
                // Centralizar o mapa na primeira unidade
                const primeiraUnidade = unidades[0];
                map.setView([primeiraUnidade.latitude, primeiraUnidade.longitude], 12); // Centraliza o mapa

                // Adicionar marcadores no mapa
                adicionarMarcadores(unidades);
            }
        } catch (error) {
            console.error("Erro ao buscar unidades:", error);
        }
    }

    // Função para adicionar marcadores no mapa
    function adicionarMarcadores(unidades) {
        unidades.forEach(unidade => {
            const { latitude, longitude, nome, temperatura, umidade, luminosidade, alerta_temperatura, alerta_umidade, alerta_luminosidade } = unidade;

            // Verifica se as coordenadas estão disponíveis
            if (latitude && longitude) {
                // Determina o ícone com base nos alertas
                const temAlerta = alerta_temperatura || alerta_umidade || alerta_luminosidade;
                const markerIcon = temAlerta ? iconRed : iconGreen;

                const marker = L.marker([latitude, longitude], { icon: markerIcon }).addTo(map);

                // Define a cor do alerta com base nos valores
                const corAlerta = (alerta) => alerta ? 'style="color: red;"' : 'style="color: green;"';

                // Conteúdo do popup ao clicar no marcador
                marker.bindPopup(`
                    <h3>${nome}</h3>
                    <p><strong>Temperatura:</strong> ${temperatura}°C</p>
                    <p><strong>Umidade:</strong> ${umidade}%</p>
                    <p><strong>Luminosidade:</strong> ${luminosidade} lux</p>
                    <p><strong>Alerta Temperatura:</strong> <span ${corAlerta(alerta_temperatura)}>${alerta_temperatura ? 'Alerta!' : 'Normal'}</span></p>
                    <p><strong>Alerta Umidade:</strong> <span ${corAlerta(alerta_umidade)}>${alerta_umidade ? 'Alerta!' : 'Normal'}</span></p>
                    <p><strong>Alerta Luminosidade:</strong> <span ${corAlerta(alerta_luminosidade)}>${alerta_luminosidade ? 'Alerta!' : 'Normal'}</span></p>
                `);
            }
        });
    }

    // Atualiza o mapa a cada 3 segundos
    setInterval(fetchUnidades, 3000);

    // Chama a função para buscar as unidades ao iniciar o mapa
    fetchUnidades();
</script>

</body>
</html>
